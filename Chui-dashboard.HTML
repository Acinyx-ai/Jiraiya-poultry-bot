<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chui Dashboard — Live WhatsApp AI Monitor</title>
<style>
:root {
  --bg: #f4efe6; --card: #fff; --accent: #6b4423; --dark-bg:#0f1720; --dark-card:#1a1f2a; --dark-accent:#d6a86a;
}
body{font-family:Inter,Arial;margin:0;background:var(--bg);color:#222;transition:.3s}
header{background:var(--accent);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
button{background:var(--accent);border:0;padding:8px 12px;color:#fff;border-radius:8px;cursor:pointer}
.container{display:grid;grid-template-columns:2fr 1fr;gap:18px;padding:20px}
.card{background:var(--card);border-radius:10px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,0.05)}
.section-title{font-weight:700;color:var(--accent);margin-bottom:8px}
.list{max-height:420px;overflow:auto}
.list-item{border-bottom:1px solid #eee;padding:8px 0}
footer{text-align:center;color:#777;padding:16px;font-size:14px}
.dark body{background:var(--dark-bg);color:#eee}.dark .card{background:var(--dark-card)}.dark header{background:var(--dark-accent)}.dark button{background:var(--dark-accent)}
@media(max-width:900px){.container{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px"><div style="font-size:28px">🐆</div><h2>Chui Dashboard</h2></div>
  <button id="toggleTheme">Toggle Dark</button>
</header>

<main class="container">
  <section class="card"><h3 class="section-title">Conversations</h3><div id="conversations" class="list">Loading...</div></section>
  <section>
    <div class="card"><h3 class="section-title">Orders</h3><div id="orders" class="list">Loading...</div></div>
    <div style="height:18px"></div>
    <div class="card"><h3 class="section-title">Camp Locations</h3><div id="locations" class="list">Loading...</div></div>
  </section>
</main>

<footer>LeopardClaws • Chui AI — Auto-refresh every 10s</footer>

<script>
let dark=false;
function esc(s){return s? s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])):'';}

async function loadConversations(){
  const r=await fetch('/api/conversations');const d=await r.json();
  const el=document.getElementById('conversations');el.innerHTML='';
  d.forEach(x=>el.innerHTML+=`<div class=list-item><b>${esc(x.whatsapp_id)}</b> — ${x.role}<br><small>${x.created_at}</small><br>${esc(x.content)}</div>`);
}
async function loadOrders(){
  const r=await fetch('/api/orders');const d=await r.json();
  const el=document.getElementById('orders');el.innerHTML='';
  d.forEach(x=>el.innerHTML+=`<div class=list-item><b>${esc(x.whatsapp_id)}</b><br>Status: ${x.status}<br>${esc(JSON.stringify(x.order))}</div>`);
}
async function loadLocations(){
  const r=await fetch('/api/locations');const d=await r.json();
  const el=document.getElementById('locations');el.innerHTML='';
  d.forEach(l=>el.innerHTML+=`<div class=list-item><b>${esc(l.guest_name)}</b> — ${esc(l.camp_name)}<br><a href="${l.map}" target="_blank">📍 View Map</a><br><small>${l.assigned_at}</small></div>`);
}
function toggleTheme(){
  dark=!dark;
  document.body.style.background=dark?'var(--dark-bg)':'var(--bg)';
  document.body.style.color=dark?'#eee':'#222';
  document.querySelectorAll('.card').forEach(c=>c.style.background=dark?'var(--dark-card)':'var(--card)');
  document.querySelector('header').style.background=dark?'var(--dark-accent)':'var(--accent)';
}
document.getElementById('toggleTheme').onclick=toggleTheme;
async function reloadAll(){await Promise.all([loadConversations(),loadOrders(),loadLocations()]);}
reloadAll();setInterval(reloadAll,10000);
</script>
</body>
</html>
